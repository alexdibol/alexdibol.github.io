name: Add Game Theory card

on:
  push:
    paths:
      - '.github/workflows/add-game-theory-card.yml'

permissions:
  contents: write

jobs:
  update-landing-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert Game Theory in the Age of AI card
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          target_url = 'https://alexdibol.github.io/ai_game_theory/'
          if target_url in html:
              print('Game Theory card already present; no insertion needed.')
          else:
              title = '<h3>Cybersecurity in the Age of Autonomous AI</h3>'
              title_pos = html.find(title)
              if title_pos == -1:
                  raise SystemExit('Cybersecurity card not found; refusing to modify index.html.')

              start = html.rfind('<article class="card">', 0, title_pos)
              if start == -1:
                  raise SystemExit('Could not locate start of Cybersecurity card.')

              end = html.find('</article>', title_pos)
              if end == -1:
                  raise SystemExit('Could not locate end of Cybersecurity card.')
              end += len('</article>')

              card = '''

          <article class="card">
            <h3>Game Theory in the Age of AI</h3>
            <p><strong>From spontaneous agent collaboration to strategic diagnosis and governed intervention.</strong></p>
            <p>
              A three-paper research journey and ten-laboratory computational collection exploring how autonomous AI agents interact, coordinate, and form strategic structures. Cooperative and non-cooperative game theory, causal diagnosis, inverse-game inference, intervention, and provenance are combined to distinguish genuine collaboration from correlation and translate emergent multi-agent behavior into defensible institutional action.
            </p>
            <div class="contact-actions">
              <a class="btn primary" href="https://alexdibol.github.io/ai_game_theory/" target="_blank" rel="noopener">Open game theory research</a>
            </div>
          </article>'''

              html = html[:end] + card + html[end:]
              path.write_text(html, encoding='utf-8')
              print('Inserted Game Theory in the Age of AI card.')

      - name: Commit landing-page update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-game-theory-card.yml
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Game Theory in the Age of AI to Pillar 1"
          git push
